[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "connectorgen"
version = "0.9.0"
description = "Generate connectors for HTTP APIs (OpenAPI, Swagger, docs) and MCP servers, run them with one runtime, and keep them working as APIs change."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ahmad Karawash" }]
keywords = ["openapi", "swagger", "mcp", "connectors", "integrations", "workflow", "automation", "llm", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "typer>=0.12",
    "publicsuffixlist>=1.0",
    "regex>=2023.0",
]

[project.urls]
Homepage = "https://github.com/karawash-projects/connectorgen"
Repository = "https://github.com/karawash-projects/connectorgen"
Issues = "https://github.com/karawash-projects/connectorgen/issues"
Changelog = "https://github.com/karawash-projects/connectorgen/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ai = ["anthropic>=0.75"]
mcp = ["mcp>=2.0", "uvicorn>=0.30"]
dev = ["pytest>=8", "respx>=0.21", "anthropic>=0.75", "mcp>=2.0", "uvicorn>=0.30"]

[project.scripts]
connectorgen = "connectorgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/connectorgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end system tests against a real local API (real sockets, ~30 s)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "PLE"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "/.connectorgen_*"]
